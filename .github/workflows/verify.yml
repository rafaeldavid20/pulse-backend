name: Verify Pulse Backend PR
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: functions
      - run: npm test 2>&1 | tee -a ../verify-output.txt
        working-directory: functions
      - run: npm install --global firebase-tools@13.22.1
      - run: npm run test:rules 2>&1 | tee -a ../verify-output.txt
        working-directory: functions
      - run: npm run test:integration 2>&1 | tee -a ../verify-output.txt
        working-directory: functions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-output
          path: verify-output.txt
