name: Deploy Pulse Backend (Cloud Functions & Firestore)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Cloud Functions & Firestore Security Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'functions/package-lock.json'

      - name: Install Cloud Functions dependencies
        run: |
          cd functions
          npm ci

      - name: Build Cloud Functions TypeScript
        run: |
          cd functions
          npm run build

      - name: Deploy to Firebase Project (pulse-app-93)
        uses: w9jds/firebase-action@v13.5.0
        with:
          args: deploy --only functions,firestore
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PULSE_APP_93 }}
