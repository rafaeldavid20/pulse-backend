name: Deploy Pulse Backend (Cloud Functions & Firestore)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Cloud Functions & Firestore Security Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cloud Functions dependencies
        run: |
          cd functions
          npm ci

      - name: Build Cloud Functions TypeScript
        run: |
          cd functions
          npm run build

      - name: Deploy to Firebase (pulse-app-93)
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            npx firebase-tools deploy --force --only functions,firestore --token "$FIREBASE_TOKEN" --project pulse-app-93
          elif [ -n "$GCP_SA_KEY" ]; then
            echo "$GCP_SA_KEY" > sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/sa.json
            npx firebase-tools deploy --force --only functions,firestore --project pulse-app-93
          else
            echo "Error: No se encontró ni FIREBASE_TOKEN ni FIREBASE_SERVICE_ACCOUNT_PULSE_APP_93 en los secrets de GitHub."
            exit 1
          fi
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PULSE_APP_93 }}
