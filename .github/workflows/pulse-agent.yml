name: Pulse Agent

# Fase 6 — disparado por `agentDispatchTrigger` (functions/src/triggers/agent-dispatch.ts)
# via `POST /repos/{owner}/{repo}/dispatches` cuando un issue con un agente
# `autonomousMode` asignado pasa a `todo`. No corre en push/PR: solo en este evento.
on:
  repository_dispatch:
    types: [pulse_task]

jobs:
  work-on-issue:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Write Pulse MCP config
        # Un archivo, no un string inline en claude_args: el header
        # "Bearer <key>" tiene un espacio, y no vale la pena confiar en cómo
        # el parser de argumentos de la acción tokeniza claude_args.
        env:
          PULSE_AGENT_MCP_KEY: ${{ secrets.PULSE_AGENT_MCP_KEY }}
        run: |
          cat > "$RUNNER_TEMP/pulse-mcp.json" <<EOF
          {
            "mcpServers": {
              "pulse": {
                "type": "http",
                "url": "https://us-east4-pulse-app-93.cloudfunctions.net/pulseMcp",
                "headers": { "Authorization": "Bearer ${PULSE_AGENT_MCP_KEY}" }
              }
            }
          }
          EOF

      - name: Run Claude Code on the dispatched issue
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # El repository_dispatch lo dispara agentDispatchTrigger vía la
          # GitHub App pulse-app-agent, no un humano — claude-code-action
          # bloquea por default los workflows iniciados por bots.
          allowed_bots: pulse-app-agent
          # TODO(diagnóstico Fase 6): sacar una vez confirmado el ciclo — el
          # output completo no debería quedar en logs públicos del workflow.
          show_full_output: true
          # claude-code-action@v1 no tiene un input `mcp_config` propio (una
          # versión anterior de la acción sí lo tenía) — se pasa como flag
          # del CLI de Claude Code vía `claude_args`. `--allowedTools
          # mcp__pulse` autoriza todas las tools de ese server sin pedir
          # confirmación interactiva, que no existe en un run headless.
          claude_args: |
            --mcp-config ${{ runner.temp }}/pulse-mcp.json
            --allowedTools mcp__pulse
          prompt: |
            Usá el MCP de Pulse para trabajar el issue con id
            "${{ github.event.client_payload.issueId }}"
            (identifier ${{ github.event.client_payload.issueIdentifier }}).

            Reclamalo con pulse_claim_issue (ya está en 'todo' y asignado a vos, no hace falta
            pulse_next_task), leé su descripción y comentarios completos, creá una rama con
            pulse_create_branch, implementá los cambios descritos, commiteá y pusheá, abrí un PR
            y linkealo con pulse_link_pr, y comentá el progreso con pulse_comment_issue. No pases
            el issue a in_review vos mismo — eso lo hace el webhook de GitHub automáticamente
            cuando el PR se abre.
